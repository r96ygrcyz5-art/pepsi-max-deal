name: Daily Pepsi Max prices

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update prices and history
        run: python update_prices.py

      - name: Save updated data
        run: |
          git config user.name "maxdeal-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/history.json
          git diff --cached --quiet || git commit -m "Update Pepsi Max prices and history"
          git push
